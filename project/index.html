<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Slider main container -->
<div class="swiper" style="width: 700px; height: 600px; border-radius: 20px;">
  <!-- Additional required wrapper -->
  <div class="swiper-wrapper">
    <!-- Slides -->
    <div class="swiper-slide"><img style="width: 100%; height: 100%; object-fit: fill;" src="Images/HelloKitty.png" alt="Slide1"></div>
    <div class="swiper-slide"><img style="width: 100%; height: 100%; object-fit: fill;" src="Images/jezek.png" alt="Slide2"></div>
    <div class="swiper-slide"><img style="width: 100%; height: 100%; object-fit: fill;" src="Images/men.jpg" alt="Slide3"></div>
    <div class="swiper-slide"><img style="width: 100%; height: 100%; object-fit: fill;" src="Images/novacek.png" alt="Slide4"></div>
  </div>
  <!-- If we need pagination -->
  <div class="swiper-pagination"></div>

  <!-- If we need navigation buttons -->
  <div class="swiper-button-prev"></div>
  <div class="swiper-button-next"></div>

  <!-- If we need scrollbar -->
  <div class="swiper-scrollbar"></div>
</div>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
/>

<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
<script src="scrip.js"></script>
<script src="swiper.js"></script>
</body>
</html>
